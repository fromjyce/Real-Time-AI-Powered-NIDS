global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nids-api"
    static_configs:
      - targets: ["nids-api:8000"]
    metrics_path: /metrics/prometheus

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9308"]

  - job_name: "elasticsearch"
    static_configs:
      - targets: ["elasticsearch:9200"]
    metrics_path: /_prometheus/metrics
